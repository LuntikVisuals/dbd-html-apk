<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NIGHT ESCAPE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:#030308; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; height:100dvh; width:100vw; }
#screen { position:relative; width:100vw; height:100dvh; }
canvas { display:block; width:100%; height:100%; }
.menu {
  position:absolute; inset:0; background:radial-gradient(ellipse at center, #1a0a18 0%, #050508 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; z-index:10;
}
.title { font-size:48px; font-weight:900; letter-spacing:6px; background:linear-gradient(180deg,#ff6b6b,#c92a2a); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.menu-btns { display:flex; flex-direction:column; gap:14px; width:280px; }
.menu-btn {
  padding:16px; font-size:18px; font-weight:700; letter-spacing:2px; border:none; border-radius:12px;
  background:#222; color:#fff; transition:0.2s;
}
.menu-btn:active { transform:scale(0.97); }
.menu-btn.primary { background:linear-gradient(180deg,#e53935,#b71c1c); }
.panel { display:none; flex-direction:column; align-items:center; gap:16px; }
.panel.active { display:flex; }
.chars { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; max-width:90%; }
.char {
  width:100px; padding:10px; border:2px solid #333; border-radius:12px; background:#111;
  text-align:center; cursor:pointer; transition:0.2s;
}
.char.selected { border-color:#4caf50; box-shadow:0 0 16px #4caf5080; }
.char-preview { width:60px; height:60px; margin:0 auto 6px; border-radius:8px; }
#hud { position:absolute; top:14px; left:16px; font-size:15px; text-shadow:0 1px 3px #000; pointer-events:none; z-index:5; }
#joystick {
  position:absolute; bottom:28px; left:28px; width:130px; height:130px;
  background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.18); border-radius:50%; z-index:5; touch-action:none;
}
#stick { position:absolute; width:54px; height:54px; background:rgba(255,255,255,0.5); border-radius:50%; top:38px; left:38px; pointer-events:none; }
#interact {
  position:absolute; bottom:34px; right:34px; width:86px; height:86px;
  background:rgba(255,152,0,0.28); border:3px solid #ff9800; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; z-index:5;
}
#interact.active { background:rgba(255,152,0,0.65); }
#msg { position:absolute; top:40%; left:50%; transform:translate(-50%,-50%); font-size:32px; font-weight:800; display:none; z-index:6; pointer-events:none; }
.back { margin-top:10px; padding:10px 24px; background:#333; border:none; border-radius:8px; color:#fff; }
</style>
</head>
<body>
<div id="screen">
  <canvas id="game"></canvas>
  <div id="mainMenu" class="menu">
    <div class="title">NIGHT ESCAPE</div>
    <div class="menu-btns">
      <button class="menu-btn primary" id="btnPlay">ИГРАТЬ</button>
      <button class="menu-btn" id="btnChars">ПЕРСОНАЖИ</button>
      <button class="menu-btn" id="btnShop">МАГАЗИН</button>
    </div>
  </div>
  <div id="playPanel" class="menu panel">
    <div class="title" style="font-size:36px">Выбери роль</div>
    <div class="menu-btns">
      <button class="menu-btn primary" id="btnSurvivor">ВЫЖИВШИЙ</button>
      <button class="menu-btn" id="btnKiller">УБИЙЦА</button>
    </div>
    <button class="back" id="backFromPlay">Назад</button>
  </div>
  <div id="charsPanel" class="menu panel">
    <div class="title" style="font-size:32px">Персонажи</div>
    <div class="chars" id="charsList"></div>
    <button class="back" id="backFromChars">Назад</button>
  </div>
  <div id="shopPanel" class="menu panel">
    <div class="title" style="font-size:32px">Магазин</div>
    <p style="opacity:0.6">Скоро</p>
    <button class="back" id="backFromShop">Назад</button>
  </div>
  <div id="hud">
    Генераторы: <span id="gens">0</span>/4<br>
    Здоровье: <span id="hp">3</span>
  </div>
  <div id="msg"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="interact">ДЕЙСТВИЕ</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mainMenu = document.getElementById('mainMenu');
const playPanel = document.getElementById('playPanel');
const charsPanel = document.getElementById('charsPanel');
const shopPanel = document.getElementById('shopPanel');
const charsList = document.getElementById('charsList');
const hudGens = document.getElementById('gens');
const hudHp = document.getElementById('hp');
const msgEl = document.getElementById('msg');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
const interactBtn = document.getElementById('interact');

function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

const WORLD = { w: 2200, h: 1500 };
const survivors = [
  { name: 'Alex', color: '#4caf50', speed: 3.6 },
  { name: 'Maya', color: '#2196f3', speed: 3.3 },
  { name: 'Leo', color: '#ff9800', speed: 3.8 },
  { name: 'Sofia', color: '#ab47bc', speed: 3.4 }
];
const killerChar = { name: 'Entity', color: '#c62828', speed: 2.7 };
let selectedSurvivor = 0;
let playerIsKiller = false;

survivors.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'char' + (i===0?' selected':'');
  div.innerHTML = `<div class="char-preview" style="background:${c.color}"></div><div>${c.name}</div>`;
  div.onclick = () => {
    document.querySelectorAll('#charsList .char').forEach(el => el.classList.remove('selected'));
    div.classList.add('selected');
    selectedSurvivor = i;
  };
  charsList.appendChild(div);
});

function showPanel(id) {
  [mainMenu, playPanel, charsPanel, shopPanel].forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
document.getElementById('btnPlay').onclick = () => showPanel('playPanel');
document.getElementById('btnChars').onclick = () => showPanel('charsPanel');
document.getElementById('btnShop').onclick = () => showPanel('shopPanel');
document.getElementById('backFromPlay').onclick = () => showPanel('mainMenu');
document.getElementById('backFromChars').onclick = () => showPanel('mainMenu');
document.getElementById('backFromShop').onclick = () => showPanel('mainMenu');

let gameStarted = false;
let gameOver = false;
let win = false;

const player = { x: 0, y: 0, r: 18, hp: 3, speed: 3.5, color: '#4caf50', angle: 0, bob: 0, moving: false, isKiller: false };
const bots = [];
const killerBot = { x: 300, y: 300, r: 24, speed: 2.6, color: '#c62828', angle: 0, bob: 0, isPlayer: false };

const gens = [
  { x: 380, y: 320, r: 34, progress: 0, done: false },
  { x: 1680, y: 380, r: 34, progress: 0, done: false },
  { x: 480, y: 1120, r: 34, progress: 0, done: false },
  { x: 1580, y: 1080, r: 34, progress: 0, done: false }
];
const walls = [
  { x: 520, y: 520, w: 240, h: 40 },
  { x: 1050, y: 280, w: 40, h: 300 },
  { x: 780, y: 900, w: 360, h: 48 },
  { x: 1250, y: 680, w: 48, h: 240 }
];
const trees = [];
for (let i=0; i<26; i++) trees.push({ x: 100+Math.random()*(WORLD.w-200), y: 100+Math.random()*(WORLD.h-200), r: 18+Math.random()*14 });
const exit = { x: WORLD.w-160, y: WORLD.h-160, r: 60, open: false };

let camera = { x:0, y:0 };
let joyX=0, joyY=0, interacting=false;

joystick.addEventListener('touchstart', e => { e.preventDefault(); updateJoy(e.touches[0]); }, {passive:false});
joystick.addEventListener('touchmove', e => { e.preventDefault(); updateJoy(e.touches[0]); }, {passive:false});
joystick.addEventListener('touchend', () => { joyX=joyY=0; stick.style.transform='translate(0,0)'; });
function updateJoy(t) {
  const r = joystick.getBoundingClientRect();
  let dx = t.clientX - (r.left+r.width/2), dy = t.clientY - (r.top+r.height/2);
  const d = Math.hypot(dx,dy), max=46;
  if (d>max) { dx=dx/d*max; dy=dy/d*max; }
  joyX=dx/max; joyY=dy/max;
  stick.style.transform=`translate(${dx}px,${dy}px)`;
}
interactBtn.addEventListener('touchstart', e=>{e.preventDefault();interacting=true;interactBtn.classList.add('active');});
interactBtn.addEventListener('touchend', ()=>{interacting=false;interactBtn.classList.remove('active');});

function startGame(asKiller) {
  playerIsKiller = asKiller;
  player.isKiller = asKiller;
  if (asKiller) {
    player.x = 400; player.y = 400; player.color = killerChar.color; player.speed = killerChar.speed; player.r = 24; player.hp = 999;
    killerBot.isPlayer = true;
    for (let i=0; i<3; i++) {
      const c = survivors[i];
      bots.push({ x: 800+i*200, y: 700+Math.random()*200, r:18, color:c.color, speed:c.speed, angle:0, bob:0, hp:3, isBot:true });
    }
  } else {
    const c = survivors[selectedSurvivor];
    player.x = WORLD.w/2; player.y = WORLD.h/2; player.color = c.color; player.speed = c.speed; player.r = 18; player.hp = 3;
    killerBot.isPlayer = false; killerBot.x = 250; killerBot.y = 250;
    for (let i=0; i<2; i++) {
      const bc = survivors[(selectedSurvivor+i+1)%survivors.length];
      bots.push({ x: 600+i*300, y: 600, r:18, color:bc.color, speed:bc.speed, angle:0, bob:0, hp:3, isBot:true });
    }
  }
  mainMenu.style.display='none'; playPanel.style.display='none'; charsPanel.style.display='none'; shopPanel.style.display='none';
  gameStarted = true;
}
document.getElementById('btnSurvivor').onclick = () => startGame(false);
document.getElementById('btnKiller').onclick = () => startGame(true);

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function collides(x,y,r){
  for(const w of walls) if(x+r>w.x && x-r<w.x+w.w && y+r>w.y && y-r<w.y+w.h) return true;
  for(const t of trees) if(dist({x,y},t)<r+t.r-8) return true;
  return false;
}
function showMsg(t){msgEl.textContent=t;msgEl.style.display='block';}

function drawChar(x,y,color,angle,isKiller,bob,moving){
  ctx.save();
  ctx.translate(x, y + Math.sin(bob)*2);
  ctx.rotate(angle);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0,14,14,6,0,0,Math.PI*2); ctx.fill();
  const by = moving ? Math.sin(bob*2)*1.5 : 0;
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.ellipse(0,2+by,12,16,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle = isKiller ? '#ffcdd2' : '#ffe0b2';
  ctx.beginPath(); ctx.arc(0,-15+by*0.4,9,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#111';
  ctx.beginPath(); ctx.arc(-3,-16,1.8,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3,-16,1.8,0,Math.PI*2); ctx.fill();
  if(isKiller){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-3,-16,1,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(3,-16,1,0,Math.PI*2); ctx.fill(); }
  const sw = moving ? Math.sin(bob*3)*6 : 0;
  ctx.strokeStyle=color; ctx.lineWidth=4; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-10,-2); ctx.lineTo(-16+sw*0.2,7+sw);
  ctx.moveTo(10,-2); ctx.lineTo(16-sw*0.2,7-sw);
  ctx.stroke();
  ctx.restore();
}

function update(dt){
  if(!gameStarted || gameOver) return;
  let dx=joyX, dy=joyY, len=Math.hypot(dx,dy);
  player.moving = len>0.15;
  if(player.moving){
    dx/=len; dy/=len; player.angle=Math.atan2(dy,dx);
    const nx=player.x+dx*player.speed*dt, ny=player.y+dy*player.speed*dt;
    if(!collides(nx,player.y,player.r)) player.x=nx;
    if(!collides(player.x,ny,player.r)) player.y=ny;
    player.x=Math.max(player.r,Math.min(WORLD.w-player.r,player.x));
    player.y=Math.max(player.r,Math.min(WORLD.h-player.r,player.y));
    player.bob+=dt*0.22;
  } else player.bob+=dt*0.07;

  if(!player.isKiller){
    const toP=dist(killerBot,player);
    if(toP>48){
      const kdx=(player.x-killerBot.x)/toP, kdy=(player.y-killerBot.y)/toP;
      killerBot.angle=Math.atan2(kdy,kdx);
      const knx=killerBot.x+kdx*killerBot.speed*dt, kny=killerBot.y+kdy*killerBot.speed*dt;
      if(!collides(knx,killerBot.y,killerBot.r)) killerBot.x=knx;
      if(!collides(killerBot.x,kny,killerBot.r)) killerBot.y=kny;
    }
    killerBot.bob+=dt*0.15;
    if(dist(player,killerBot)<player.r+killerBot.r-6){
      player.hp--; hudHp.textContent=player.hp;
      const kdx=(player.x-killerBot.x)/Math.max(1,toP), kdy=(player.y-killerBot.y)/Math.max(1,toP);
      player.x+=kdx*90; player.y+=kdy*90;
      if(player.hp<=0){ gameOver=true; showMsg('ПОЙМАН'); }
    }
  }

  bots.forEach(b=>{
    if(b.hp<=0) return;
    let target = player.isKiller ? player : killerBot;
    const d = dist(b, target);
    if(d > 60){
      const bdx = (target.x - b.x)/d * (player.isKiller ? -1 : 1);
      const bdy = (target.y - b.y)/d * (player.isKiller ? -1 : 1);
      b.angle = Math.atan2(bdy, bdx);
      const bnx = b.x + bdx * b.speed * 0.6 * dt;
      const bny = b.y + bdy * b.speed * 0.6 * dt;
      if(!collides(bnx,b.y,b.r)) b.x=bnx;
      if(!collides(b.x,bny,b.r)) b.y=bny;
    }
    b.bob += dt*0.12;
    if(player.isKiller && dist(player,b) < player.r + b.r - 4 && interacting){
      b.hp--;
      const kdx=(b.x-player.x)/Math.max(1,dist(player,b)), kdy=(b.y-player.y)/Math.max(1,dist(player,b));
      b.x += kdx*80; b.y += kdy*80;
      if(b.hp<=0) b.color='#444';
    }
  });

  if(!player.isKiller){
    let done=0;
    gens.forEach(g=>{
      if(g.done){done++;return;}
      if(dist(player,g)<g.r+44 && interacting){
        g.progress += 0.006*dt;
        if(g.progress>=1){g.done=true;g.progress=1;}
      }
      if(g.done) done++;
    });
    hudGens.textContent=done;
    if(done>=4) exit.open=true;
    if(exit.open && dist(player,exit)<exit.r+player.r){ win=true; gameOver=true; showMsg('СБЕЖАЛ'); }
  } else {
    let alive = bots.filter(b=>b.hp>0).length;
    hudGens.textContent = alive;
    if(alive===0){ gameOver=true; showMsg('ВСЕ ПОЙМАНЫ'); }
  }

  const focus = player;
  camera.x = focus.x - canvas.width/2;
  camera.y = focus.y - canvas.height/2;
  camera.x = Math.max(0, Math.min(WORLD.w-canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h-canvas.height, camera.y));
}

function draw(){
  ctx.fillStyle='#08080c';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!gameStarted) return;
  ctx.save();
  ctx.translate(-camera.x,-camera.y);
  ctx.fillStyle='#121218';
  ctx.fillRect(0,0,WORLD.w,WORLD.h);
  trees.forEach(t=>{
    ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2);
    ctx.fillStyle='#1a3a1a'; ctx.fill();
    ctx.beginPath(); ctx.arc(t.x,t.y-6,t.r*0.5,0,Math.PI*2);
    ctx.fillStyle='#2a5a2a'; ctx.fill();
  });
  walls.forEach(w=>{ ctx.fillStyle='#252528'; ctx.fillRect(w.x,w.y,w.w,w.h); ctx.strokeStyle='#444'; ctx.strokeRect(w.x,w.y,w.w,w.h); });
  if(!player.isKiller){
    ctx.beginPath(); ctx.arc(exit.x,exit.y,exit.r,0,Math.PI*2);
    ctx.fillStyle=exit.open?'#0d47a1':'#121218'; ctx.fill();
    ctx.strokeStyle=exit.open?'#42a5f5':'#333'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
    ctx.fillText(exit.open?'ВЫХОД':'ЗАКРЫТ', exit.x, exit.y+5);
    gens.forEach(g=>{
      ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,Math.PI*2);
      ctx.fillStyle=g.done?'#2e7d32':'#e65100'; ctx.fill();
      if(!g.done){ ctx.fillStyle='#000'; ctx.fillRect(g.x-24,g.y-44,48,8); ctx.fillStyle='#fff'; ctx.fillRect(g.x-24,g.y-44,48*g.progress,8); }
    });
  }
  if(!player.isKiller) drawChar(killerBot.x,killerBot.y,killerBot.color,killerBot.angle,true,killerBot.bob,true);
  bots.forEach(b=>{ if(b.hp>0) drawChar(b.x,b.y,b.color,b.angle,false,b.bob,true); });
  drawChar(player.x,player.y,player.color,player.angle,player.isKiller,player.bob,player.moving);
  ctx.restore();
}

let last=performance.now();
function loop(t){
  const dt=Math.min(40,t-last)/16.67; last=t;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
