<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NIGHT ESCAPE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:#030308; color:#fff; font-family:system-ui, -apple-system, sans-serif; overflow:hidden; touch-action:none; height:100dvh; width:100vw; }
#screen { position:relative; width:100vw; height:100dvh; }
canvas { display:block; width:100%; height:100%; }
#lobby {
  position:absolute; inset:0; background:radial-gradient(ellipse at center, #1a0a18 0%, #050508 70%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  z-index:10; overflow:hidden;
}
#lobby::before {
  content:''; position:absolute; inset:0;
  background:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><circle cx="2" cy="2" r="1" fill="%23ffffff08"/></svg>');
  opacity:0.4; pointer-events:none;
}
.title {
  font-size:52px; font-weight:900; letter-spacing:8px; text-transform:uppercase;
  background:linear-gradient(180deg, #ff6b6b, #c92a2a); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  text-shadow:0 0 40px rgba(255,60,60,0.4); animation:pulse 3s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.02)} }
.subtitle { opacity:0.6; font-size:15px; letter-spacing:3px; text-transform:uppercase; }
.chars { display:flex; gap:16px; margin:10px 0; }
.char {
  width:110px; height:150px; border:2px solid #333; border-radius:16px; background:linear-gradient(180deg,#111,#0a0a0a);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:12px; gap:6px;
  cursor:pointer; transition:all 0.25s; position:relative; overflow:hidden;
}
.char::before {
  content:''; position:absolute; inset:0; background:radial-gradient(circle at 50% 30%, rgba(255,255,255,0.05), transparent 70%);
}
.char.selected { border-color:#4caf50; box-shadow:0 0 24px rgba(76,175,80,0.5); transform:translateY(-4px); }
.char-preview {
  width:70px; height:70px; border-radius:12px; margin-bottom:4px; position:relative;
  animation:float 2.5s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
.char-name { font-size:14px; font-weight:600; }
.char-stat { font-size:11px; opacity:0.5; }
#startBtn {
  padding:16px 64px; font-size:20px; background:linear-gradient(180deg,#e53935,#b71c1c); border:none; border-radius:12px;
  color:#fff; font-weight:800; letter-spacing:3px; text-transform:uppercase;
  box-shadow:0 8px 24px rgba(229,57,53,0.4); transition:0.2s;
}
#startBtn:active { transform:scale(0.96); }
#hud {
  position:absolute; top:16px; left:18px; font-size:15px; text-shadow:0 1px 4px #000;
  pointer-events:none; z-index:5; line-height:1.4;
}
#joystick {
  position:absolute; bottom:32px; left:32px; width:140px; height:140px;
  background:rgba(255,255,255,0.06); border:2px solid rgba(255,255,255,0.15); border-radius:50%;
  z-index:5; touch-action:none;
}
#stick {
  position:absolute; width:58px; height:58px; background:rgba(255,255,255,0.5);
  border-radius:50%; top:41px; left:41px; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
#interact {
  position:absolute; bottom:40px; right:40px; width:92px; height:92px;
  background:rgba(255,152,0,0.25); border:3px solid #ff9800; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; letter-spacing:1px;
  z-index:5; touch-action:none; transition:0.15s;
}
#interact.active { background:rgba(255,152,0,0.7); transform:scale(0.95); }
#msg {
  position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
  font-size:36px; font-weight:800; text-align:center; text-shadow:0 0 16px #000; display:none; z-index:6;
  pointer-events:none; letter-spacing:2px;
}
</style>
</head>
<body>
<div id="screen">
  <canvas id="game"></canvas>
  <div id="lobby">
    <div class="title">NIGHT ESCAPE</div>
    <div class="subtitle">Выживи • Почини • Сбеги</div>
    <div class="chars" id="chars"></div>
    <button id="startBtn">Начать охоту</button>
  </div>
  <div id="hud">
    Генераторы: <span id="gens">0</span>/4<br>
    Здоровье: <span id="hp">3</span>
  </div>
  <div id="msg"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="interact">РЕМОНТ</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lobby = document.getElementById('lobby');
const startBtn = document.getElementById('startBtn');
const charsDiv = document.getElementById('chars');
const hudGens = document.getElementById('gens');
const hudHp = document.getElementById('hp');
const msgEl = document.getElementById('msg');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
const interactBtn = document.getElementById('interact');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

const WORLD = { w: 2200, h: 1500 };
const characters = [
  { name: 'Alex', color: '#4caf50', speed: 3.6, stat: 'Быстрый' },
  { name: 'Maya', color: '#2196f3', speed: 3.3, stat: 'Тихая' },
  { name: 'Leo', color: '#ff9800', speed: 3.8, stat: 'Ловкий' }
];
let selectedChar = 0;
let animTime = 0;

characters.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'char' + (i===0?' selected':'');
  div.innerHTML = `<div class="char-preview" style="background:${c.color}"></div><div class="char-name">${c.name}</div><div class="char-stat">${c.stat}</div>`;
  div.onclick = () => {
    document.querySelectorAll('.char').forEach(el => el.classList.remove('selected'));
    div.classList.add('selected');
    selectedChar = i;
  };
  charsDiv.appendChild(div);
});

let gameStarted = false;
let gameOver = false;
let win = false;

const player = { x: WORLD.w/2, y: WORLD.h/2, r: 18, hp: 3, speed: 3.5, color: '#4caf50', angle: 0, bob: 0, moving: false };
const killer = { x: 300, y: 300, r: 24, speed: 2.6, color: '#c62828', angle: 0, bob: 0 };

const gens = [
  { x: 380, y: 320, r: 34, progress: 0, done: false },
  { x: 1680, y: 380, r: 34, progress: 0, done: false },
  { x: 480, y: 1120, r: 34, progress: 0, done: false },
  { x: 1580, y: 1080, r: 34, progress: 0, done: false }
];

const walls = [
  { x: 520, y: 520, w: 240, h: 40 },
  { x: 1050, y: 280, w: 40, h: 300 },
  { x: 780, y: 900, w: 360, h: 48 },
  { x: 1250, y: 680, w: 48, h: 240 },
  { x: 300, y: 700, w: 180, h: 36 }
];

const trees = [];
for (let i=0; i<28; i++) {
  trees.push({
    x: 100 + Math.random()*(WORLD.w-200),
    y: 100 + Math.random()*(WORLD.h-200),
    r: 20 + Math.random()*16,
    shade: 0.7 + Math.random()*0.3
  });
}

const ruins = [
  { x: 900, y: 450, w: 80, h: 60 },
  { x: 1400, y: 850, w: 70, h: 90 }
];

const exit = { x: WORLD.w - 160, y: WORLD.h - 160, r: 60, open: false };

let camera = { x: 0, y: 0 };
let joystickActive = false;
let joyX = 0, joyY = 0;
let interacting = false;

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  updateJoy(e.touches[0]);
}, {passive:false});
joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joystickActive) updateJoy(e.touches[0]);
}, {passive:false});
joystick.addEventListener('touchend', () => {
  joystickActive = false;
  joyX = joyY = 0;
  stick.style.transform = 'translate(0,0)';
});

function updateJoy(t) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const max = 46;
  if (dist > max) {
    dx = dx / dist * max;
    dy = dy / dist * max;
  }
  joyX = dx / max;
  joyY = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

interactBtn.addEventListener('touchstart', e => { e.preventDefault(); interacting = true; interactBtn.classList.add('active'); });
interactBtn.addEventListener('touchend', () => { interacting = false; interactBtn.classList.remove('active'); });

startBtn.onclick = () => {
  const ch = characters[selectedChar];
  player.speed = ch.speed;
  player.color = ch.color;
  lobby.style.display = 'none';
  gameStarted = true;
};

function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function collidesWall(x, y, r) {
  for (const w of walls) {
    if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) return true;
  }
  for (const t of trees) {
    if (dist({x,y}, t) < r + t.r - 8) return true;
  }
  return false;
}

function showMsg(text) {
  msgEl.textContent = text;
  msgEl.style.display = 'block';
}

function drawCharacter(x, y, color, angle, isKiller, bob, moving) {
  ctx.save();
  ctx.translate(x, y + Math.sin(bob) * 2);
  ctx.rotate(angle);

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 14, 15, 7, 0, 0, Math.PI*2);
  ctx.fill();

  const bodyY = moving ? Math.sin(bob * 2) * 1.5 : 0;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 2 + bodyY, 13, 17, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = isKiller ? '#ffcdd2' : '#ffe0b2';
  ctx.beginPath();
  ctx.arc(0, -16 + bodyY * 0.5, 10, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(-3.5, -17, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5, -17, 2, 0, Math.PI*2); ctx.fill();
  if (isKiller) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3.5, -17, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3.5, -17, 1.2, 0, Math.PI*2); ctx.fill();
  }

  const armSwing = moving ? Math.sin(bob * 3) * 8 : 0;
  ctx.strokeStyle = color;
  ctx.lineWidth = 4.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-11, -2);
  ctx.lineTo(-18 + armSwing * 0.3, 8 + armSwing);
  ctx.moveTo(11, -2);
  ctx.lineTo(18 - armSwing * 0.3, 8 - armSwing);
  ctx.stroke();

  ctx.restore();
}

function update(dt) {
  animTime += dt * 0.05;
  if (!gameStarted || gameOver) return;

  let dx = joyX;
  let dy = joyY;
  const len = Math.hypot(dx, dy);
  player.moving = len > 0.15;
  if (player.moving) {
    dx /= len; dy /= len;
    player.angle = Math.atan2(dy, dx);
    const nx = player.x + dx * player.speed * dt;
    const ny = player.y + dy * player.speed * dt;
    if (!collidesWall(nx, player.y, player.r)) player.x = nx;
    if (!collidesWall(player.x, ny, player.r)) player.y = ny;
    player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));
    player.bob += dt * 0.25;
  } else {
    player.bob += dt * 0.08;
  }

  const toP = dist(killer, player);
  if (toP > 50) {
    const kdx = (player.x - killer.x) / toP;
    const kdy = (player.y - killer.y) / toP;
    killer.angle = Math.atan2(kdy, kdx);
    const knx = killer.x + kdx * killer.speed * dt;
    const kny = killer.y + kdy * killer.speed * dt;
    if (!collidesWall(knx, killer.y, killer.r)) killer.x = knx;
    if (!collidesWall(killer.x, kny, killer.r)) killer.y = kny;
    killer.bob += dt * 0.2;
  } else {
    killer.bob += dt * 0.1;
  }

  if (dist(player, killer) < player.r + killer.r - 8) {
    player.hp--;
    hudHp.textContent = player.hp;
    const kb = 100;
    const kdx = (player.x - killer.x) / Math.max(1, toP);
    const kdy = (player.y - killer.y) / Math.max(1, toP);
    player.x += kdx * kb;
    player.y += kdy * kb;
    if (player.hp <= 0) {
      gameOver = true;
      showMsg('ПОЙМАН');
    }
  }

  let doneCount = 0;
  gens.forEach(g => {
    if (g.done) { doneCount++; return; }
    if (dist(player, g) < g.r + 46 && interacting) {
      g.progress += 0.006 * dt;
      if (g.progress >= 1) { g.done = true; g.progress = 1; }
    }
    if (g.done) doneCount++;
  });
  hudGens.textContent = doneCount;
  if (doneCount >= 4) exit.open = true;

  if (exit.open && dist(player, exit) < exit.r + player.r) {
    win = true;
    gameOver = true;
    showMsg('СБЕЖАЛ');
  }

  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;
  camera.x = Math.max(0, Math.min(WORLD.w - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - canvas.height, camera.y));
}

function draw() {
  ctx.fillStyle = '#08080c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!gameStarted) return;

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  const grd = ctx.createRadialGradient(WORLD.w/2, WORLD.h/2, 100, WORLD.w/2, WORLD.h/2, 900);
  grd.addColorStop(0, '#14141a');
  grd.addColorStop(1, '#0a0a10');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  for (let i=0; i<40; i++) {
    const gx = (i * 137) % WORLD.w;
    const gy = (i * 211) % WORLD.h;
    ctx.fillStyle = 'rgba(20,40,20,0.15)';
    ctx.beginPath();
    ctx.ellipse(gx, gy, 30, 18, 0, 0, Math.PI*2);
    ctx.fill();
  }

  trees.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
    ctx.fillStyle = `rgb(${20*t.shade},${50*t.shade},${20*t.shade})`;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(t.x, t.y - 8, t.r * 0.55, 0, Math.PI*2);
    ctx.fillStyle = `rgb(${30*t.shade},${70*t.shade},${30*t.shade})`;
    ctx.fill();
  });

  walls.forEach(w => {
    ctx.fillStyle = '#252528';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#444';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  });

  ruins.forEach(r => {
    ctx.fillStyle = '#1e1e22';
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = '#333';
    ctx.strokeRect(r.x, r.y, r.w, r.h);
  });

  ctx.beginPath();
  ctx.arc(exit.x, exit.y, exit.r, 0, Math.PI*2);
  ctx.fillStyle = exit.open ? '#0d47a1' : '#121218';
  ctx.fill();
  ctx.strokeStyle = exit.open ? '#42a5f5' : '#333';
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(exit.open ? 'ВЫХОД' : 'ЗАКРЫТ', exit.x, exit.y + 6);

  gens.forEach(g => {
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI*2);
    ctx.fillStyle = g.done ? '#2e7d32' : '#e65100';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (!g.done) {
      ctx.fillStyle = '#000';
      ctx.fillRect(g.x - 26, g.y - 46, 52, 10);
      ctx.fillStyle = '#fff';
      ctx.fillRect(g.x - 26, g.y - 46, 52 * g.progress, 10);
    }
  });

  drawCharacter(killer.x, killer.y, killer.color, killer.angle, true, killer.bob, true);
  drawCharacter(player.x, player.y, player.color, player.angle, false, player.bob, player.moving);

  ctx.restore();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(40, t - last) / 16.67;
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
