<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Escape the Entity</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { background:#050505; color:#fff; font-family:system-ui,sans-serif; overflow:hidden; touch-action:none; height:100dvh; width:100vw; }
#screen { position:relative; width:100vw; height:100dvh; }
canvas { display:block; width:100%; height:100%; }
#lobby {
  position:absolute; inset:0; background:linear-gradient(160deg,#0a0a12,#1a0a1a);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;
  z-index:10;
}
#lobby h1 { font-size:48px; letter-spacing:6px; text-shadow:0 0 24px #f00; color:#ff4444; }
#lobby p { opacity:0.75; font-size:16px; }
.chars { display:flex; gap:20px; }
.char {
  width:100px; height:130px; border:2px solid #333; border-radius:14px; background:#111;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  cursor:pointer; transition:0.2s;
}
.char.selected { border-color:#4caf50; box-shadow:0 0 18px #4caf50; }
.char-preview { width:60px; height:60px; border-radius:8px; position:relative; }
#startBtn {
  padding:18px 56px; font-size:22px; background:#e53935; border:none; border-radius:10px;
  color:#fff; font-weight:bold; letter-spacing:2px;
}
#hud {
  position:absolute; top:14px; left:16px; font-size:16px; text-shadow:0 1px 4px #000;
  pointer-events:none; z-index:5;
}
#joystick {
  position:absolute; bottom:28px; left:28px; width:130px; height:130px;
  background:rgba(255,255,255,0.07); border:2px solid rgba(255,255,255,0.18); border-radius:50%;
  z-index:5; touch-action:none;
}
#stick {
  position:absolute; width:54px; height:54px; background:rgba(255,255,255,0.45);
  border-radius:50%; top:38px; left:38px; pointer-events:none;
}
#interact {
  position:absolute; bottom:36px; right:36px; width:88px; height:88px;
  background:rgba(255,152,0,0.28); border:3px solid #ff9800; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:14px;
  z-index:5; touch-action:none;
}
#interact.active { background:rgba(255,152,0,0.65); }
#msg {
  position:absolute; top:42%; left:50%; transform:translate(-50%,-50%);
  font-size:32px; text-align:center; text-shadow:0 0 12px #000; display:none; z-index:6;
  pointer-events:none;
}
</style>
</head>
<body>
<div id="screen">
  <canvas id="game"></canvas>
  <div id="lobby">
    <h1>ESCAPE</h1>
    <p>Выживи. Почини генераторы. Сбеги.</p>
    <div class="chars" id="chars"></div>
    <button id="startBtn">НАЧАТЬ ИГРУ</button>
  </div>
  <div id="hud">
    Генераторы: <span id="gens">0</span>/4<br>
    Здоровье: <span id="hp">3</span>
  </div>
  <div id="msg"></div>
  <div id="joystick"><div id="stick"></div></div>
  <div id="interact">РЕМОНТ</div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const lobby = document.getElementById('lobby');
const startBtn = document.getElementById('startBtn');
const charsDiv = document.getElementById('chars');
const hudGens = document.getElementById('gens');
const hudHp = document.getElementById('hp');
const msgEl = document.getElementById('msg');
const joystick = document.getElementById('joystick');
const stick = document.getElementById('stick');
const interactBtn = document.getElementById('interact');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));

const WORLD = { w: 2000, h: 1400 };
const characters = [
  { name: 'Alex', color: '#4caf50', speed: 3.5 },
  { name: 'Maya', color: '#2196f3', speed: 3.2 },
  { name: 'Leo', color: '#ff9800', speed: 3.7 }
];
let selectedChar = 0;

characters.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'char' + (i===0?' selected':'');
  div.innerHTML = `<div class="char-preview" style="background:${c.color}"></div><div>${c.name}</div>`;
  div.onclick = () => {
    document.querySelectorAll('.char').forEach(el => el.classList.remove('selected'));
    div.classList.add('selected');
    selectedChar = i;
  };
  charsDiv.appendChild(div);
});

let gameStarted = false;
let gameOver = false;
let win = false;

const player = { x: WORLD.w/2, y: WORLD.h/2, r: 18, hp: 3, vx:0, vy:0, angle: 0 };
const killer = { x: 250, y: 250, r: 22, speed: 2.5, color: '#c62828', angle: 0 };

const gens = [
  { x: 350, y: 280, r: 32, progress: 0, done: false },
  { x: 1550, y: 320, r: 32, progress: 0, done: false },
  { x: 450, y: 1050, r: 32, progress: 0, done: false },
  { x: 1450, y: 1000, r: 32, progress: 0, done: false }
];

const walls = [
  { x: 500, y: 500, w: 220, h: 36 },
  { x: 1000, y: 250, w: 36, h: 280 },
  { x: 750, y: 850, w: 340, h: 44 },
  { x: 1200, y: 650, w: 44, h: 220 }
];

const trees = [];
for (let i=0; i<22; i++) {
  trees.push({
    x: 120 + Math.random()*(WORLD.w-240),
    y: 120 + Math.random()*(WORLD.h-240),
    r: 22 + Math.random()*18
  });
}

const exit = { x: WORLD.w - 140, y: WORLD.h - 140, r: 55, open: false };

let camera = { x: 0, y: 0 };
let joystickActive = false;
let joyX = 0, joyY = 0;
let interacting = false;

joystick.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  updateJoy(e.touches[0]);
}, {passive:false});
joystick.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joystickActive) updateJoy(e.touches[0]);
}, {passive:false});
joystick.addEventListener('touchend', e => {
  joystickActive = false;
  joyX = joyY = 0;
  stick.style.transform = 'translate(0,0)';
});

function updateJoy(t) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  let dx = t.clientX - cx;
  let dy = t.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const max = 42;
  if (dist > max) {
    dx = dx / dist * max;
    dy = dy / dist * max;
  }
  joyX = dx / max;
  joyY = dy / max;
  stick.style.transform = `translate(${dx}px, ${dy}px)`;
}

interactBtn.addEventListener('touchstart', e => { e.preventDefault(); interacting = true; interactBtn.classList.add('active'); });
interactBtn.addEventListener('touchend', e => { interacting = false; interactBtn.classList.remove('active'); });

startBtn.onclick = () => {
  const ch = characters[selectedChar];
  player.speed = ch.speed;
  player.color = ch.color;
  lobby.style.display = 'none';
  gameStarted = true;
};

function dist(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

function collidesWall(x, y, r) {
  for (const w of walls) {
    if (x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h) return true;
  }
  for (const t of trees) {
    if (dist({x,y}, t) < r + t.r - 6) return true;
  }
  return false;
}

function showMsg(text) {
  msgEl.textContent = text;
  msgEl.style.display = 'block';
}

function drawCharacter(x, y, color, angle, isKiller) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, 12, 14, 6, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.ellipse(0, 2, 12, 16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Head
  ctx.fillStyle = isKiller ? '#ffcdd2' : '#ffe0b2';
  ctx.beginPath();
  ctx.arc(0, -14, 9, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Eyes
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-3, -15, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3, -15, 1.8, 0, Math.PI*2); ctx.fill();

  if (isKiller) {
    // Mask-like eyes
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3, -15, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -15, 1.2, 0, Math.PI*2); ctx.fill();
  }

  // Arms
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-10, -2);
  ctx.lineTo(-16, 6);
  ctx.moveTo(10, -2);
  ctx.lineTo(16, 6);
  ctx.stroke();

  ctx.restore();
}

function update(dt) {
  if (!gameStarted || gameOver) return;

  let dx = joyX;
  let dy = joyY;
  const len = Math.hypot(dx, dy);
  if (len > 0.1) {
    dx /= len; dy /= len;
    player.angle = Math.atan2(dy, dx);
    const nx = player.x + dx * player.speed * dt;
    const ny = player.y + dy * player.speed * dt;
    if (!collidesWall(nx, player.y, player.r)) player.x = nx;
    if (!collidesWall(player.x, ny, player.r)) player.y = ny;
    player.x = Math.max(player.r, Math.min(WORLD.w - player.r, player.x));
    player.y = Math.max(player.r, Math.min(WORLD.h - player.r, player.y));
  }

  const toP = dist(killer, player);
  if (toP > 45) {
    const kdx = (player.x - killer.x) / toP;
    const kdy = (player.y - killer.y) / toP;
    killer.angle = Math.atan2(kdy, kdx);
    const knx = killer.x + kdx * killer.speed * dt;
    const kny = killer.y + kdy * killer.speed * dt;
    if (!collidesWall(knx, killer.y, killer.r)) killer.x = knx;
    if (!collidesWall(killer.x, kny, killer.r)) killer.y = kny;
  }

  if (dist(player, killer) < player.r + killer.r - 6) {
    player.hp--;
    hudHp.textContent = player.hp;
    const kb = 90;
    const kdx = (player.x - killer.x) / Math.max(1, toP);
    const kdy = (player.y - killer.y) / Math.max(1, toP);
    player.x += kdx * kb;
    player.y += kdy * kb;
    if (player.hp <= 0) {
      gameOver = true;
      showMsg('Пойман...');
    }
  }

  let doneCount = 0;
  gens.forEach(g => {
    if (g.done) { doneCount++; return; }
    if (dist(player, g) < g.r + 42 && interacting) {
      g.progress += 0.0055 * dt;
      if (g.progress >= 1) { g.done = true; g.progress = 1; }
    }
    if (g.done) doneCount++;
  });
  hudGens.textContent = doneCount;
  if (doneCount >= 4) exit.open = true;

  if (exit.open && dist(player, exit) < exit.r + player.r) {
    win = true;
    gameOver = true;
    showMsg('Сбежал!');
  }

  camera.x = player.x - canvas.width/2;
  camera.y = player.y - canvas.height/2;
  camera.x = Math.max(0, Math.min(WORLD.w - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(WORLD.h - canvas.height, camera.y));
}

function draw() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (!gameStarted) return;

  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  ctx.fillStyle = '#121212';
  ctx.fillRect(0, 0, WORLD.w, WORLD.h);

  trees.forEach(t => {
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
    ctx.fillStyle = '#1a3a1a';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(t.x, t.y - 6, t.r * 0.55, 0, Math.PI*2);
    ctx.fillStyle = '#2a5a2a';
    ctx.fill();
  });

  walls.forEach(w => {
    ctx.fillStyle = '#2c2c2c';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(w.x, w.y, w.w, w.h);
  });

  ctx.beginPath();
  ctx.arc(exit.x, exit.y, exit.r, 0, Math.PI*2);
  ctx.fillStyle = exit.open ? '#0d47a1' : '#1a1a1a';
  ctx.fill();
  ctx.strokeStyle = exit.open ? '#42a5f5' : '#444';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = '15px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(exit.open ? 'ВЫХОД' : 'ЗАКРЫТ', exit.x, exit.y + 5);

  gens.forEach(g => {
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r, 0, Math.PI*2);
    ctx.fillStyle = g.done ? '#2e7d32' : '#e65100';
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();
    if (!g.done) {
      ctx.fillStyle = '#000';
      ctx.fillRect(g.x - 24, g.y - 42, 48, 8);
      ctx.fillStyle = '#fff';
      ctx.fillRect(g.x - 24, g.y - 42, 48 * g.progress, 8);
    }
  });

  drawCharacter(killer.x, killer.y, killer.color, killer.angle, true);
  drawCharacter(player.x, player.y, player.color || '#4caf50', player.angle, false);

  ctx.restore();
}

let last = performance.now();
function loop(t) {
  const dt = Math.min(40, t - last) / 16.67;
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
