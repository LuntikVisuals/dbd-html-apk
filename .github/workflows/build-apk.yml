name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Bump versionCode so new APK can install over old one
        run: |
          # Capacitor generates android/app/build.gradle
          # Replace versionCode 1 with run number (always higher)
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          # Also set versionName to match release tag style
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          echo "=== Updated version ==="
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbd-html-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Escape the Entity v1.0.${{ github.run_number }}
          body: |
            Мобильная версия игры Escape the Entity (стиль Dead by Daylight).
            - Лобби с выбором персонажа
            - Карта с деревьями и стенами
            - Джойстик + кнопка ремонта
            - 4 генератора, Киллер, выход
            - versionCode = ${{ github.run_number }} (установка поверх старой версии)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
