name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bump versionCode so new APK can install over old one
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '1.0.${{ github.run_number }}'/" android/app/build.gradle
          echo "=== Updated version ==="
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Debug APK
        run: |
          cd android
          # Generate wrapper if missing
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbd-html-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Escape the Entity v1.0.${{ github.run_number }}
          body: |
            HTML игра Escape the Entity в WebView (landscape).
            Архитектура по принципу zavodnye-koshmary: чистый Android WebView, HTML в assets.
            - Лобби, персонажи, карта, джойстик
            - versionCode = ${{ github.run_number }} (установка поверх)
          files: android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
